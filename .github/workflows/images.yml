# Builds the api and web container images and pushes them to GitHub Container
# Registry as ghcr.io/<owner>/servicemap-api and ghcr.io/<owner>/servicemap-web.
#
#   pull request   build only (verifies the Dockerfiles), nothing is pushed
#   push to main   push :main, :sha-<short>, and :latest
#   tag v1.2.3     push :1.2.3, :1.2, and :sha-<short>
#   manual run     push tags for the selected branch
#
# Every run also generates a CycloneDX SBOM for each image with syft (the
# format Dependency-Track ingests) and uploads it as a workflow artifact, then
# scans that SBOM with grype and writes the findings to the run summary.
# Runs that push also upload the SBOM to Dependency-Track as project
# <image>, version <tag> (main, 1.2.3, ...), once these are set:
#   variable  DEPENDENCYTRACK_URL      API base URL, e.g. https://dtrack-api.example.com
#   secret    DEPENDENCYTRACK_API_KEY  key of a team with BOM_UPLOAD and
#                                      PROJECT_CREATION_UPLOAD
#   secret    CF_ACCESS_CLIENT_ID      Cloudflare Access service token in
#   secret    CF_ACCESS_CLIENT_SECRET  front of Dependency-Track
name: Container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: servicemap-api
            context: .
            dockerfile: Dockerfile
          - image: servicemap-web
            context: web
            dockerfile: web/Dockerfile
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the org name is not.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          load: true # into the runner's Docker so syft can scan it on PRs too
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          artifact-name: ${{ matrix.image }}.cdx.json
          output-file: ${{ matrix.image }}.cdx.json

      # Report only for now: a failing build would also block the AKS deploy.
      # Set fail-build: true once the existing findings have been triaged.
      - name: Vulnerability scan
        uses: anchore/scan-action@v7
        with:
          sbom: ${{ matrix.image }}.cdx.json
          fail-build: false
          output-format: table
          output-file: ${{ matrix.image }}-grype.txt

      - name: Vulnerability summary
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### grype: $IMAGE"
            echo '```'
            cat "$IMAGE-grype.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Plain curl rather than DependencyTrack/gh-upload-sbom, which cannot
      # send the Cloudflare Access headers.
      - name: Upload SBOM to Dependency-Track
        if: env.PUSH == 'true' && vars.DEPENDENCYTRACK_URL != ''
        env:
          DT_URL: ${{ vars.DEPENDENCYTRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PROJECT: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Not following redirects: curl would resend the POST as a GET. A
          # redirect here means the URL is wrong (http:// instead of https://,
          # or a Cloudflare redirect rule), so fail and show where it points.
          status=$(curl --silent --show-error --retry 3 \
            -o response.txt -D headers.txt -w '%{http_code}' \
            -H "X-Api-Key: $DT_API_KEY" \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET" \
            -F "projectName=$PROJECT" \
            -F "projectVersion=$VERSION" \
            -F "autoCreate=true" \
            -F "bom=@$PROJECT.cdx.json" \
            "${DT_URL%/}/api/v1/bom")
          cat response.txt; echo
          if [ "$status" != 200 ]; then
            location=$(grep -i '^location:' headers.txt | tr -d '\r' || true)
            echo "::error::Dependency-Track upload returned HTTP $status${location:+ ($location)}"
            exit 1
          fi
