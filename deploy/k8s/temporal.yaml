# Temporal development server (single process, SQLite on a disk), as in
# compose. Good enough for the POC; for production use the temporalio Helm
# chart or Temporal Cloud and point TEMPORAL_ADDRESS in api.yaml at it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
  labels:
    app.kubernetes.io/name: temporal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate # the ReadWriteOnce disk attaches to one pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # makes the Azure disk writable for the SQLite file
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: docker.io/temporalio/temporal:1.9.1
          args: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
          readinessProbe:
            tcpSocket:
              port: grpc
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-data
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: ui
      port: 8233
      targetPort: ui
