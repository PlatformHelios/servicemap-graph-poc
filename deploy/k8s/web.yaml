# Standalone dashboard (nginx), proxying /api to servicemap-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicemap-web
  labels:
    app.kubernetes.io/name: servicemap-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: servicemap-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servicemap-web
    spec:
      imagePullSecrets:
        - name: ghcr # optional; the deploy workflow creates it when GHCR_PULL_TOKEN is set
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/platformhelios/servicemap-web
          ports:
            - name: http
              containerPort: 8080
          env:
            # Fully qualified: nginx's resolver does not apply resolv.conf search domains.
            - name: API_UPSTREAM
              value: http://servicemap-api.servicemap.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: servicemap-web
  labels:
    app.kubernetes.io/name: servicemap-web
spec:
  selector:
    app.kubernetes.io/name: servicemap-web
  ports:
    - name: http
      port: 8080
      targetPort: http
