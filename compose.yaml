# Local environment for servicemap-graph-poc.
#
#   podman compose up -d             everything; api and web always pull the newest published :latest
#   podman compose up -d --build     everything, with api and web built from the working tree instead
#   podman compose up -d neo4j otel-collector loki prometheus grafana kafka temporal
#                                    prerequisites only, to run the apps on the host
#
# (docker compose works the same way.) Containers reach each other by service
# name (neo4j:7687, otel-collector:4318, kafka:19092, temporal:7233), not localhost.
name: servicemap

services:
  api:
    build: .
    image: ghcr.io/platformhelios/servicemap-api:latest
    pull_policy: always # check GHCR for a newer :latest on every up
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-your_password}
      OTEL_SERVICE_NAME: servicemap-graph-poc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TEMPORAL_ADDRESS: temporal:7233 # Service Catalog automation
      TEMPORAL_UI_URL: http://localhost:8233 # links from the Workflow Analyzer
    ports:
      - "127.0.0.1:8080:8080" # API, Swagger UI, and the embedded dashboard
    depends_on:
      neo4j:
        condition: service_healthy
      otel-collector:
        condition: service_started
      temporal:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    image: ghcr.io/platformhelios/servicemap-web:latest
    pull_policy: always # check GHCR for a newer :latest on every up
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:8081:8080" # standalone dashboard, proxies /api to the api service
    depends_on:
      - api
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-your_password}
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  otel-collector:
    image: docker.io/otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: grafanaManagedRecordingRules
    volumes:
      - ./deploy/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  kafka:
    image: docker.io/apache/kafka:4.3.1
    environment:
      CLUSTER_ID: servicemap-local-kafka01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT is for other containers, PLAINTEXT_HOST for apps on the host.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    restart: unless-stopped

  # Temporal development server (single process, SQLite) for Service Catalog
  # automation. Teams' workers and the API's catalog worker connect on 7233;
  # the Temporal UI is on 8233.
  temporal:
    image: docker.io/temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    volumes:
      - temporal-data:/data
    ports:
      - "7233:7233" # gRPC frontend
      - "8233:8233" # Temporal UI
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  loki-data:
  prometheus-data:
  grafana-data:
  kafka-data:
  temporal-data:
